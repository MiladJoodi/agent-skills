<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal archive of Agent Skills." />
    <title>Agent Skills</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var stored = localStorage.getItem("agent-skills-theme");
        var theme = stored || "dark";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          Agent Skills
        </a>
        <div class="site-nav">
          <a
            class="github-link"
            id="github-stars"
            href="https://github.com/MiladJoodi/agent-skills"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Star on GitHub"
          >
            <svg class="github-octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
              />
            </svg>
            <svg class="github-star" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path
                fill="currentColor"
                d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25z"
              />
            </svg>
            <span class="github-star-count" id="github-star-count">–</span>
          </a>
          <button
            type="button"
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Toggle color theme"
          >
            <span class="theme-toggle-icons" aria-hidden="true">
              <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="22" height="22" fill="none">
                <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" />
                <path
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                />
              </svg>
              <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="22" height="22" fill="none">
                <path
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"
                />
              </svg>
            </span>
          </button>
        </div>
      </div>
    </header>

    <main id="main">
      <section id="catalog" class="catalog catalog-home" aria-labelledby="catalog-title">
        <div class="container">
          <div class="section-head">
            <h1 id="catalog-title">Skill <span class="accent">catalog</span></h1>
            <p class="section-kicker">My skill collection</p>
          </div>

          <div class="toolbar">
            <label class="search-field">
              <span class="visually-hidden">Search skills</span>
              <input
                type="search"
                id="search-input"
                placeholder="Search…"
                autocomplete="off"
              />
            </label>
          </div>

          <p class="results-meta" id="results-meta" aria-live="polite">Loading skills…</p>
          <ul class="skills-tree" id="skills-grid"></ul>
          <p class="empty-state" id="empty-state" hidden>No skills match.</p>
        </div>
      </section>
    </main>

    <div id="skill-drawer" class="skill-drawer" hidden>
      <div class="drawer-backdrop" id="drawer-backdrop"></div>
      <aside
        class="drawer-panel"
        id="drawer-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="drawer-title"
      >
        <header class="drawer-header">
          <div class="drawer-heading">
            <h2 id="drawer-title">Skill</h2>
            <div class="drawer-sub" id="drawer-sub"></div>
          </div>
          <button type="button" class="drawer-close" id="drawer-close" aria-label="Close">
            ×
          </button>
        </header>
        <div class="drawer-body" id="drawer-body"></div>
      </aside>
    </div>

    <script src="js/skills-data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
